<div class="app-layout">
  <app-navbar></app-navbar>

  <main class="content">
    <div class="content-inner">
      <!-- Aquí cargan las páginas (Foro, Nueva publicación, Detalle…) -->
      <router-outlet></router-outlet>

      <footer class="app-footer">
        <p>&copy; 2026 ThinkerLog. Todos los derechos reservados.</p>
        <div class="footer-links">
          <a href="#">Términos de servicio</a>
          <span class="separator">•</span>
          <a href="#">Política de privacidad</a>
          <span class="separator">•</span>
          <a href="#">Contacto</a>
        </div>
      </footer>
    </div>
  </main>

<!-- Avisos PWA -->
<div class="toasts" aria-live="polite">
  @if (!pwa.isOnline()) {
    <div class="toast warn">🔴 Sin conexión — mostrando contenido guardado</div>
  }
  @if (pwa.updateAvailable()) {
    <div class="toast">
      🔄 Hay una nueva versión de ThinkerLog
      <button (click)="pwa.applyUpdate()">Actualizar</button>
    </div>
  }
</div>
